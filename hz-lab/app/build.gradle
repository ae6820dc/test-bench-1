plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ae6820dc.hzlab'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.ae6820dc.hzlab'
        minSdk 31
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'com.ae6820dc.hzlab.SmokeInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
